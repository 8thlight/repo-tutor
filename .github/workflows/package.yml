name: package

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build the release archives
        run: nix develop --command just build-release-archives v0.0.0-ci
      - name: Render the Homebrew formula
        run: nix develop --command just render-homebrew-formula v0.0.0-ci
      - name: Build the Nix package
        run: nix build .#default --no-link
