name: update-homebrew-tap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag whose formula goes to the tap, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a release tag such as v0.1.0."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the formula from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern repo-tutor.rb --dir output/release
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP_URL: git@github.com:${{ vars.HOMEBREW_TAP_REPOSITORY || '8thlight/homebrew-tap' }}.git
        run: nix develop --command just update-homebrew-tap "${TAG}" main
