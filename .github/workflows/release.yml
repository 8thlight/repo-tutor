name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing
        required: true
        default: v0.0.0-dryrun

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run every check
        run: nix develop --command just check
      - name: Build the archives
        run: nix develop --command just dist "${VERSION}"
      - name: Render the Homebrew formula
        run: nix develop --command just formula "${VERSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ env.VERSION }}
          path: output/dist/*
          retention-days: 7
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-path: output/dist/*.tar.gz
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${VERSION}" output/dist/* --generate-notes --verify-tag
      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP_URL: git@github.com:${{ vars.HOMEBREW_TAP_REPOSITORY || '8thlight/homebrew-tap' }}.git
          TAP_BRANCH: ${{ github.ref_type == 'tag' && 'main' || 'dryrun' }}
        run: |
          if [ -z "${TAP_DEPLOY_KEY}" ]; then
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not set, so the tap is not updated."
            exit 0
          fi
          nix develop --command just tap-update "${VERSION}" "${TAP_BRANCH}"
