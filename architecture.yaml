components_root: internal
model: null
contracts_root: contracts
entry_point: binary

naming:
  component_path: "<noun>/<role>"
  segment_pattern: "^[a-z][a-z0-9]*$"

acceptance:
  scenarios: code
  may_import: [github.com/microsoft/tui-test]

libraries:
  terminal:
    - charm.land/bubbletea/v2
    - charm.land/bubbles/v2
    - charm.land/lipgloss/v2
    - charm.land/glamour/v2
    - github.com/charmbracelet/x/ansi
    - github.com/charmbracelet/x/term
    - github.com/charmbracelet/colorprofile
    - github.com/alecthomas/chroma/v2

banned_in_core:
  - filesystem
  - network
  - process
  - terminal
  - clock
  - randomness
  - environment

drivers:
  - about/reader
  - agent/runner
  - file/writer
  - lesson/pruner
  - repository/reader
  - session/store
  - settings/store
  - terminal

components:
  - name: file/writer
    position: 1
    depends_on: []
  - name: about
    position: 1
    depends_on: []
  - name: repository/analyzer
    position: 1
    depends_on: []
  - name: settings/codec
    position: 1
    depends_on: []
  - name: about/reader
    position: 2
    depends_on: [about]
  - name: repository/reader
    position: 2
    depends_on: [repository/analyzer]
  - name: tutor
    position: 2
    depends_on: [repository/analyzer]
  - name: agent/runner
    position: 3
    depends_on: [tutor]
  - name: session/store
    position: 3
    depends_on: [file/writer, tutor]
  - name: settings/store
    position: 4
    depends_on: [file/writer, session/store, settings/codec]
  - name: lesson/pruner
    position: 4
    depends_on: [session/store]
  - name: terminal
    position: 5
    depends_on: [about, about/reader, agent/runner, lesson/pruner, repository/analyzer, repository/reader, session/store, settings/codec, settings/store, tutor]
