components_root: internal
model: null
contracts_root: contracts
entry_point: binary

naming:
  component_path: "<noun>/<role>"
  segment_pattern: "^[a-z][a-z0-9]*$"

acceptance:
  scenarios: code
  may_import: [github.com/microsoft/tui-test]

banned_in_core:
  - filesystem
  - network
  - process
  - terminal
  - clock
  - randomness
  - environment

drivers:
  - agent/runner
  - repository/reader
  - session
  - terminal

components:
  - name: about
    position: 1
    depends_on: []
  - name: repository/analyzer
    position: 1
    depends_on: []
  - name: settings/codec
    position: 1
    depends_on: []
  - name: repository/reader
    position: 2
    depends_on: [repository/analyzer]
  - name: tutor
    position: 2
    depends_on: [repository/analyzer]
  - name: agent/runner
    position: 3
    depends_on: [tutor]
  - name: session
    position: 3
    depends_on: [settings/codec, tutor]
  - name: terminal
    position: 4
    depends_on: [about, agent/runner, repository/analyzer, repository/reader, session, settings/codec, tutor]
